services:
  postgres:
    image: postgres:16-alpine
    container_name: metaverse-postgres
    restart: always
    environment:
      POSTGRES_USER: metaverse_user
      POSTGRES_PASSWORD: metaverse_pass
      POSTGRES_DB: metaverse_db
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U metaverse_user -d metaverse_db']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
